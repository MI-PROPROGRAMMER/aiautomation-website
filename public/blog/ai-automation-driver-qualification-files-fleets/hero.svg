<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00B5E2" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#7fb6d6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <text x="140" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>
  <text x="140" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Driver Qualification</text>
  <text x="140" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Files, Kept Current</text>
  <text x="140" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#cfe5f1" opacity="0.9">Every compliance clock watched, every day</text>

  <!-- Four DQ clocks: ring gauges showing time remaining -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <g transform="translate(290,690)">
      <circle r="105" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
      <circle r="80" fill="none" stroke="#002347" stroke-width="16"/>
      <circle r="80" fill="none" stroke="#00B5E2" stroke-width="16" stroke-linecap="round" stroke-dasharray="380 503" transform="rotate(-90)"/>
      <text y="-4" font-size="30" font-weight="bold" fill="#ffffff">Medical</text>
      <text y="30" font-size="20" fill="#7fb6d6">certificate</text>
    </g>
    <g transform="translate(593,690)">
      <circle r="105" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
      <circle r="80" fill="none" stroke="#002347" stroke-width="16"/>
      <circle r="80" fill="none" stroke="#7fb6d6" stroke-width="16" stroke-linecap="round" stroke-dasharray="250 503" transform="rotate(-90)"/>
      <text y="-4" font-size="30" font-weight="bold" fill="#ffffff">MVR</text>
      <text y="30" font-size="20" fill="#7fb6d6">annual review</text>
    </g>
    <g transform="translate(896,690)">
      <circle r="105" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
      <circle r="80" fill="none" stroke="#002347" stroke-width="16"/>
      <circle r="80" fill="none" stroke="#00B5E2" stroke-width="16" stroke-linecap="round" stroke-dasharray="440 503" transform="rotate(-90)"/>
      <text y="-4" font-size="28" font-weight="bold" fill="#ffffff">Clearinghouse</text>
      <text y="30" font-size="20" fill="#7fb6d6">annual query</text>
    </g>
    <g transform="translate(1199,690)">
      <circle r="105" fill="#0a3a66" stroke="#00B5E2" stroke-width="3"/>
      <circle r="80" fill="none" stroke="#002347" stroke-width="16"/>
      <circle r="80" fill="none" stroke="#cfe5f1" stroke-width="16" stroke-linecap="round" stroke-dasharray="90 503" transform="rotate(-90)"/>
      <text y="-4" font-size="30" font-weight="bold" fill="#ffffff">Prior</text>
      <text y="30" font-size="20" fill="#7fb6d6">employer check</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
