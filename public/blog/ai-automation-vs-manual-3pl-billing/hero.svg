<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#001a36"/><stop offset="1" stop-color="#002347"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B5E2" stop-opacity="0"/><stop offset="0.35" stop-color="#00B5E2"/><stop offset="0.65" stop-color="#00B5E2"/><stop offset="1" stop-color="#00B5E2" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="750" y="200" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="8">THE JOURNAL</text>
  <text x="750" y="318" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">Work Done vs Work Billed</text>
  <text x="750" y="388" text-anchor="middle" fill="#cfe5f1" fill-opacity="0.9" font-family="Georgia, 'Times New Roman', serif" font-size="36">AI automation for 3PL warehouse billing</text>
  <line x1="600" y1="436" x2="900" y2="436" stroke="#00B5E2" stroke-opacity="0.35" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="440" y="490" fill="#7fb6d6" font-size="22" letter-spacing="3">ON THE FLOOR</text>
    <text x="900" y="490" fill="#00B5E2" font-size="22" letter-spacing="3">ON THE INVOICE</text>
        <text x="200" y="535" fill="#cfe5f1" font-size="24">Receiving</text>
    <rect x="440" y="513" width="440" height="30" rx="4" fill="#0a3a66" stroke="#5e8aa6" stroke-opacity="0.7"/>
    <rect x="900" y="513" width="440" height="30" rx="4" fill="#00B5E2" fill-opacity="0.85"/>
    <text x="200" y="593" fill="#cfe5f1" font-size="24">Pick and pack</text>
    <rect x="440" y="571" width="440" height="30" rx="4" fill="#0a3a66" stroke="#5e8aa6" stroke-opacity="0.7"/>
    <rect x="900" y="571" width="440" height="30" rx="4" fill="#00B5E2" fill-opacity="0.85"/>
    <text x="200" y="651" fill="#cfe5f1" font-size="24">Storage (daily)</text>
    <rect x="440" y="629" width="396" height="30" rx="4" fill="#0a3a66" stroke="#5e8aa6" stroke-opacity="0.7"/>
    <rect x="900" y="629" width="273" height="30" rx="4" fill="#00B5E2" fill-opacity="0.85"/>
    <rect x="1173" y="629" width="123" height="30" rx="4" fill="none" stroke="#7fb6d6" stroke-dasharray="8 6" stroke-opacity="0.8"/>
    <text x="200" y="709" fill="#cfe5f1" font-size="24">Kitting</text>
    <rect x="440" y="687" width="308" height="30" rx="4" fill="#0a3a66" stroke="#5e8aa6" stroke-opacity="0.7"/>
    <rect x="900" y="687" width="308" height="30" rx="4" fill="none" stroke="#7fb6d6" stroke-dasharray="8 6" stroke-opacity="0.8"/>
    <text x="200" y="767" fill="#cfe5f1" font-size="24">Relabeling</text>
    <rect x="440" y="745" width="242" height="30" rx="4" fill="#0a3a66" stroke="#5e8aa6" stroke-opacity="0.7"/>
    <rect x="900" y="745" width="242" height="30" rx="4" fill="none" stroke="#7fb6d6" stroke-dasharray="8 6" stroke-opacity="0.8"/>
    <text x="200" y="825" fill="#cfe5f1" font-size="24">Rush receipt</text>
    <rect x="440" y="803" width="176" height="30" rx="4" fill="#0a3a66" stroke="#5e8aa6" stroke-opacity="0.7"/>
    <rect x="900" y="803" width="176" height="30" rx="4" fill="none" stroke="#7fb6d6" stroke-dasharray="8 6" stroke-opacity="0.8"/>
    <text x="1340" y="852" text-anchor="end" fill="#7fb6d6" font-size="20" font-style="italic">dashed = done, never billed</text>
  </g>
  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
