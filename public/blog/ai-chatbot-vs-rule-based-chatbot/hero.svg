<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Three customer messages routed through a rule-based keyword match, where one falls to a fallback, compared with a language model that routes all three to a resolution">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="modelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.3">
    <path d="M0 205 H1500"/><path d="M0 400 H1500"/><path d="M0 660 H1500"/><path d="M0 845 H1500"/>
  </g>

  <g transform="translate(180,228)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="98" font-size="84" font-weight="700" fill="#ffffff">AI Chatbot vs</text>
    <text y="186" font-size="84" font-weight="700" fill="#ffffff">Rule-Based Chatbot</text>
    <text y="250" font-size="36" font-weight="400" fill="#cfe5f1" opacity="0.9">what happens to the question nobody mapped</text>
  </g>

  <g transform="translate(180,548)" font-family="Georgia, serif">

    <g>
      <text font-size="14" letter-spacing="3" fill="#7fb6d6">RULE-BASED  ·  MATCHED OR MISSED</text>

      <g font-size="13" fill="#cfe5f1">
        <g fill="#0a3a66" fill-opacity="0.65" stroke="#5e8aa6" stroke-width="1.2">
          <rect x="0" y="34" width="208" height="34"/><rect x="0" y="88" width="208" height="34"/><rect x="0" y="142" width="208" height="34"/>
        </g>
        <text x="12" y="56" fill="#cfe5f1">"where is my order"</text>
        <text x="12" y="110" fill="#cfe5f1">"change my address"</text>
        <text x="12" y="164" fill="#cfe5f1">"says delivered, not here"</text>
      </g>

      <g stroke="#5e8aa6" stroke-width="1.4" opacity="0.8" fill="none">
        <path d="M210 51 H248 V88"/><path d="M210 105 H248"/><path d="M210 159 H248 V122"/>
      </g>

      <rect x="250" y="76" width="112" height="58" fill="#0a3a66" fill-opacity="0.75" stroke="#5e8aa6" stroke-width="1.4"/>
      <text x="306" y="99" font-size="12" letter-spacing="1" fill="#cfe5f1" text-anchor="middle">KEYWORD</text>
      <text x="306" y="118" font-size="12" letter-spacing="1" fill="#cfe5f1" text-anchor="middle">MATCH</text>

      <g stroke="#5e8aa6" stroke-width="1.4" opacity="0.8" fill="none">
        <path d="M364 96 H392 V51 H400"/><path d="M364 105 H392 V105 H400"/>
      </g>
      <path d="M364 114 H392 V159 H400" stroke="#5e8aa6" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6" fill="none"/>

      <g stroke="#5e8aa6" stroke-width="1.2" fill="#0a3a66" fill-opacity="0.65">
        <rect x="402" y="34" width="143" height="34"/><rect x="402" y="88" width="143" height="34"/>
      </g>
      <rect x="402" y="142" width="143" height="34" fill="none" stroke="#5e8aa6" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
      <g font-size="13" text-anchor="middle">
        <text x="473" y="56" fill="#cfe5f1">FLOW A</text>
        <text x="473" y="110" fill="#cfe5f1">FLOW B</text>
        <text x="473" y="164" fill="#5e8aa6">FALLBACK</text>
      </g>

      <text y="222" font-size="13" fill="#5e8aa6" letter-spacing="1">OFF-SCRIPT GOES TO A PERSON · OR NOWHERE</text>
    </g>

    <g transform="translate(595,0)">
      <text font-size="14" letter-spacing="3" fill="#00B5E2" opacity="0.9">AI  ·  INTERPRETED, THEN ROUTED</text>

      <g font-size="13">
        <g fill="#0a3a66" fill-opacity="0.65" stroke="#5e8aa6" stroke-width="1.2">
          <rect x="0" y="34" width="208" height="34"/><rect x="0" y="88" width="208" height="34"/><rect x="0" y="142" width="208" height="34"/>
        </g>
        <text x="12" y="56" fill="#cfe5f1">"where is my order"</text>
        <text x="12" y="110" fill="#cfe5f1">"change my address"</text>
        <text x="12" y="164" fill="#cfe5f1">"says delivered, not here"</text>
      </g>

      <g stroke="#00B5E2" stroke-width="1.5" opacity="0.85" fill="none">
        <path d="M210 51 H248 V88"/><path d="M210 105 H248"/><path d="M210 159 H248 V122"/>
      </g>

      <rect x="250" y="76" width="112" height="58" fill="url(#modelFill)"/>
      <text x="306" y="99" font-size="12" letter-spacing="1" fill="#001a36" font-weight="700" text-anchor="middle">LANGUAGE</text>
      <text x="306" y="118" font-size="12" letter-spacing="1" fill="#001a36" font-weight="700" text-anchor="middle">MODEL</text>

      <g stroke="#00B5E2" stroke-width="1.5" opacity="0.85" fill="none">
        <path d="M364 96 H392 V51 H400"/><path d="M364 105 H392 V105 H400"/><path d="M364 114 H392 V159 H400"/>
      </g>

      <g stroke="#00B5E2" stroke-width="1.2" stroke-opacity="0.6" fill="#0a3a66" fill-opacity="0.65">
        <rect x="402" y="34" width="143" height="34"/><rect x="402" y="88" width="143" height="34"/><rect x="402" y="142" width="143" height="34"/>
      </g>
      <g font-size="13" fill="#cfe5f1" text-anchor="middle">
        <text x="473" y="56">ORDER LOOKUP</text>
        <text x="473" y="110">ADDRESS FLOW</text>
        <text x="473" y="164">CLAIM + ESCALATE</text>
      </g>

      <text y="222" font-size="13" fill="#00B5E2" opacity="0.85" letter-spacing="1">UNMAPPED PHRASING STILL LANDS SOMEWHERE</text>
    </g>

    <text y="288" font-size="12" letter-spacing="2" fill="#5e8aa6">EITHER WAY, WHAT THE BOT CAN REACH DECIDES WHETHER IT RESOLVES ANYTHING</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
