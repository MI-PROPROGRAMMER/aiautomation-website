<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Automation ROI scorecard comparing opportunity value, effort, risk, and time to value">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barStrong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#7fb6d6"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.32">
    <path d="M0 210 H1500"/><path d="M0 430 H1500"/><path d="M0 650 H1500"/><path d="M0 860 H1500"/>
  </g>

  <g transform="translate(180,170)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="94" font-size="76" font-weight="700" fill="#ffffff">Automation ROI Playbook:</text>
    <text y="176" font-size="76" font-weight="700" fill="#ffffff">Turn AI Experiments Into</text>
    <text y="258" font-size="76" font-weight="700" fill="#ffffff">Pipeline Growth</text>
    <text y="320" font-size="32" font-weight="400" fill="#cfe5f1" opacity="0.9">Score the opportunity before funding the build</text>
  </g>

  <g transform="translate(180,575)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="14" letter-spacing="3" fill="#7fb6d6">OPPORTUNITY SCORECARD</text>

    <g transform="translate(0,38)">
      <text x="0" y="24" font-size="15" fill="#cfe5f1">VOLUME</text>
      <rect x="170" y="5" width="560" height="24" rx="4" fill="#0a3a66"/>
      <rect x="170" y="5" width="490" height="24" rx="4" fill="url(#barStrong)"/>
      <text x="755" y="24" font-size="14" fill="#00B5E2">HIGH</text>

      <text x="0" y="78" font-size="15" fill="#cfe5f1">VALUE</text>
      <rect x="170" y="59" width="560" height="24" rx="4" fill="#0a3a66"/>
      <rect x="170" y="59" width="435" height="24" rx="4" fill="url(#barStrong)"/>
      <text x="755" y="78" font-size="14" fill="#00B5E2">STRONG</text>

      <text x="0" y="132" font-size="15" fill="#cfe5f1">COMPLEXITY</text>
      <rect x="170" y="113" width="560" height="24" rx="4" fill="#0a3a66"/>
      <rect x="170" y="113" width="310" height="24" rx="4" fill="#5e8aa6"/>
      <text x="755" y="132" font-size="14" fill="#7fb6d6">MEDIUM</text>

      <text x="0" y="186" font-size="15" fill="#cfe5f1">TIME TO VALUE</text>
      <rect x="170" y="167" width="560" height="24" rx="4" fill="#0a3a66"/>
      <rect x="170" y="167" width="465" height="24" rx="4" fill="url(#barStrong)"/>
      <text x="755" y="186" font-size="14" fill="#00B5E2">FAST</text>
    </g>

    <g transform="translate(900,16)">
      <rect width="330" height="250" rx="16" fill="#0a3a66" fill-opacity="0.48" stroke="#5e8aa6" stroke-opacity="0.55"/>
      <text x="165" y="42" text-anchor="middle" font-size="13" letter-spacing="3" fill="#7fb6d6">PILOT PRIORITY</text>
      <text x="165" y="126" text-anchor="middle" font-size="68" font-weight="700" fill="#00B5E2">87</text>
      <text x="165" y="158" text-anchor="middle" font-size="15" fill="#cfe5f1">OUT OF 100</text>
      <path d="M56 190 H274" stroke="#5e8aa6" stroke-width="1" opacity="0.5"/>
      <text x="165" y="222" text-anchor="middle" font-size="14" letter-spacing="2" fill="#cfe5f1">FUND THE PROOF OF VALUE</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
