<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Four-week agentic AI pilot blueprint from framing the workflow through governed launch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#00B5E2"/>
    </marker>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.32">
    <path d="M0 210 H1500"/><path d="M0 430 H1500"/><path d="M0 650 H1500"/><path d="M0 860 H1500"/>
  </g>

  <g transform="translate(180,170)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="94" font-size="76" font-weight="700" fill="#ffffff">Agentic AI Blueprint:</text>
    <text y="176" font-size="76" font-weight="700" fill="#ffffff">Launch High-Impact</text>
    <text y="258" font-size="76" font-weight="700" fill="#ffffff">Automation Pilots in 30 Days</text>
    <text y="320" font-size="32" font-weight="400" fill="#cfe5f1" opacity="0.9">A governed path from one workflow to measurable scale</text>
  </g>

  <g transform="translate(180,590)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="14" letter-spacing="3" fill="#7fb6d6">THE 30-DAY PILOT PATH</text>
    <path d="M90 112 H1055" stroke="#0a3a66" stroke-width="16" stroke-linecap="round"/>
    <path d="M90 112 H1055" stroke="#00B5E2" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(0,52)">
      <circle cx="90" cy="60" r="32" fill="#001a36" stroke="#00B5E2" stroke-width="3"/>
      <text x="90" y="67" text-anchor="middle" font-size="20" font-weight="700" fill="#cfe5f1">01</text>
      <text x="90" y="126" text-anchor="middle" font-size="15" letter-spacing="2" fill="#00B5E2">FRAME</text>
      <text x="90" y="154" text-anchor="middle" font-size="14" fill="#7fb6d6">workflow + baseline</text>

      <circle cx="410" cy="60" r="32" fill="#001a36" stroke="#00B5E2" stroke-width="3"/>
      <text x="410" y="67" text-anchor="middle" font-size="20" font-weight="700" fill="#cfe5f1">02</text>
      <text x="410" y="126" text-anchor="middle" font-size="15" letter-spacing="2" fill="#00B5E2">ASSEMBLE</text>
      <text x="410" y="154" text-anchor="middle" font-size="14" fill="#7fb6d6">data + guardrails</text>

      <circle cx="730" cy="60" r="32" fill="#001a36" stroke="#00B5E2" stroke-width="3"/>
      <text x="730" y="67" text-anchor="middle" font-size="20" font-weight="700" fill="#cfe5f1">03</text>
      <text x="730" y="126" text-anchor="middle" font-size="15" letter-spacing="2" fill="#00B5E2">SHADOW</text>
      <text x="730" y="154" text-anchor="middle" font-size="14" fill="#7fb6d6">edge cases + overrides</text>

      <circle cx="1050" cy="60" r="32" fill="#00B5E2" stroke="#cfe5f1" stroke-width="3"/>
      <text x="1050" y="67" text-anchor="middle" font-size="20" font-weight="700" fill="#001a36">04</text>
      <text x="1050" y="126" text-anchor="middle" font-size="15" letter-spacing="2" fill="#00B5E2">LAUNCH</text>
      <text x="1050" y="154" text-anchor="middle" font-size="14" fill="#7fb6d6">measure + scale</text>
    </g>

    <g transform="translate(1160,20)">
      <rect width="160" height="210" rx="12" fill="#0a3a66" fill-opacity="0.42" stroke="#5e8aa6" stroke-opacity="0.55"/>
      <text x="80" y="35" text-anchor="middle" font-size="12" letter-spacing="2" fill="#7fb6d6">CONTROL LOOP</text>
      <circle cx="80" cy="92" r="28" fill="#001a36" stroke="#00B5E2" stroke-width="2"/>
      <path d="M80 64 A28 28 0 1 1 56 107" fill="none" stroke="#00B5E2" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="80" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#cfe5f1">ACT</text>
      <text x="80" y="148" text-anchor="middle" font-size="13" fill="#cfe5f1">human checkpoint</text>
      <text x="80" y="174" text-anchor="middle" font-size="13" fill="#7fb6d6">logs + rollback</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
