<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="How LTL Reweigh Fees Compound on Freight Broker P&amp;L">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="0.55" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#5e8aa6"/>
    </linearGradient>
    <linearGradient id="growBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a3a66"/>
      <stop offset="1" stop-color="#00B5E2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="url(#bg)"/>

  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <text x="100" y="200" fill="#00B5E2" font-size="22" letter-spacing="6" font-weight="600">THE JOURNAL</text>
    <text x="100" y="230" fill="#7fb6d6" font-size="18" letter-spacing="3">LOGISTICS · LTL INVOICE AUDIT</text>
  </g>

  <g font-family="Georgia,'Times New Roman',serif" fill="#ffffff">
    <text x="100" y="360" font-size="82" font-weight="700">How LTL Reweigh Fees</text>
    <text x="100" y="452" font-size="82" font-weight="700">Compound on Broker P&amp;Ls</text>
  </g>

  <text x="100" y="520" font-family="Georgia,'Times New Roman',serif" fill="#cfe5f1" font-size="34" opacity="0.9">A quiet post-invoice charge with a compounding annual base.</text>

  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <g transform="translate(120,620)">
      <rect x="0" y="0" width="360" height="200" rx="10" fill="#0a3a66" stroke="#5e8aa6" stroke-width="1"/>
      <text x="24" y="36" fill="#7fb6d6" font-size="18" letter-spacing="3">ORIGINAL QUOTE</text>
      <line x1="24" y1="54" x2="336" y2="54" stroke="#5e8aa6" stroke-opacity="0.35"/>
      <text x="24" y="92" fill="#cfe5f1" font-size="22">Declared 1,000 lb</text>
      <text x="24" y="122" fill="#cfe5f1" font-size="22">LTL invoice</text>
      <text x="336" y="178" text-anchor="end" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700">$420</text>
    </g>

    <g transform="translate(530,700)">
      <path d="M 0 40 L 60 40 L 60 25 L 100 55 L 60 85 L 60 70 L 0 70 Z" fill="#00B5E2"/>
      <text x="50" y="120" text-anchor="middle" fill="#00B5E2" font-size="18" font-weight="600" letter-spacing="2">REWEIGHED</text>
    </g>

    <g transform="translate(660,620)">
      <rect x="0" y="0" width="360" height="200" rx="10" fill="#ffffff"/>
      <rect x="0" y="0" width="360" height="24" rx="10" fill="#00B5E2"/>
      <text x="24" y="52" fill="#5e8aa6" font-size="18" letter-spacing="3">REWEIGHED INVOICE</text>
      <line x1="24" y1="68" x2="336" y2="68" stroke="#cfe5f1"/>
      <text x="24" y="104" fill="#0a3a66" font-size="22">Corrected 1,180 lb</text>
      <text x="24" y="134" fill="#0a3a66" font-size="22">Reweigh fee + rerate</text>
      <text x="336" y="184" text-anchor="end" fill="#001a36" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700">$454</text>
    </g>

    <g transform="translate(1080,560)">
      <text x="0" y="24" fill="#7fb6d6" font-size="18" letter-spacing="3">ANNUAL COMPOUND</text>
      <text x="0" y="52" fill="#cfe5f1" font-size="16">500-load desk · 5% reweigh rate</text>

      <text x="0" y="112" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700">~$44K</text>
      <text x="0" y="136" fill="#cfe5f1" font-size="14">raw reprice base, before fees</text>

      <g transform="translate(0,260)">
        <rect x="0" y="-16" width="52" height="16" fill="url(#growBar)"/>
        <text x="26" y="20" text-anchor="middle" fill="#7fb6d6" font-size="14">WK</text>

        <rect x="80" y="-42" width="52" height="42" fill="url(#growBar)"/>
        <text x="106" y="20" text-anchor="middle" fill="#7fb6d6" font-size="14">MO</text>

        <rect x="160" y="-72" width="52" height="72" fill="url(#growBar)"/>
        <text x="186" y="20" text-anchor="middle" fill="#7fb6d6" font-size="14">QTR</text>

        <rect x="240" y="-110" width="52" height="110" fill="url(#growBar)"/>
        <text x="266" y="20" text-anchor="middle" fill="#00B5E2" font-size="14" font-weight="700">YEAR</text>
      </g>
    </g>

    <g transform="translate(120,860)">
      <text x="0" y="0" fill="#7fb6d6" font-size="16" letter-spacing="3">APEXIFYLABS</text>
      <text x="920" y="0" fill="#7fb6d6" font-size="16" letter-spacing="3" text-anchor="end">apexifylabs.com/blog</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
