<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a66"/>
      <stop offset="0.25" stop-color="#7fb6d6"/>
      <stop offset="0.6" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#0a3a66"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="150" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>
  <text x="150" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Order Status Calls</text>
  <text x="150" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#cfe5f1" opacity="0.9">Sizing the AI chatbot return for manufacturers</text>

  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- Inbound stack of inquiries -->
    <text x="150" y="455" font-size="20" letter-spacing="3" fill="#7fb6d6">INBOUND · ONE DAY</text>
    <rect x="150" y="475" width="330" height="58" rx="10" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
    <text x="172" y="513" font-size="26" fill="#ffffff">When does PO 4471 ship?</text>
    <rect x="150" y="548" width="330" height="58" rx="10" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
    <text x="172" y="586" font-size="26" fill="#ffffff">Tracking for SO 20918?</text>
    <rect x="150" y="621" width="330" height="58" rx="10" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
    <text x="172" y="659" font-size="26" fill="#ffffff">Is line 3 backordered?</text>
    <rect x="150" y="694" width="330" height="58" rx="10" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
    <text x="172" y="732" font-size="26" fill="#ffffff">Can you expedite?</text>
    <text x="150" y="800" font-size="24" fill="#cfe5f1" opacity="0.8">50 contacts x 6 min</text>

    <!-- Router -->
    <path d="M500 615 L640 615" stroke="#cfe5f1" stroke-width="3" fill="none"/>
    <circle cx="690" cy="615" r="50" fill="#002347" stroke="#00B5E2" stroke-width="4"/>
    <text x="690" y="625" font-size="28" font-weight="bold" fill="#00B5E2" text-anchor="middle">AI</text>

    <!-- Routine branch -->
    <path d="M740 600 C820 560 840 510 900 510" stroke="#00B5E2" stroke-width="4" fill="none"/>
    <rect x="900" y="455" width="450" height="110" rx="16" fill="none" stroke="#00B5E2" stroke-width="3"/>
    <text x="930" y="497" font-size="20" letter-spacing="3" fill="#00B5E2">ANSWERED FROM ERP</text>
    <text x="930" y="540" font-size="32" fill="#ffffff">Routine status, in seconds</text>
    <rect x="900" y="585" width="315" height="18" rx="9" fill="#00B5E2"/>
    <rect x="1215" y="585" width="135" height="18" rx="9" fill="#5e8aa6"/>

    <!-- Exception branch -->
    <path d="M740 630 C820 680 840 720 900 720" stroke="#7fb6d6" stroke-width="4" fill="none"/>
    <rect x="900" y="665" width="450" height="110" rx="16" fill="none" stroke="#7fb6d6" stroke-width="3"/>
    <text x="930" y="707" font-size="20" letter-spacing="3" fill="#7fb6d6">ROUTED TO A REP</text>
    <text x="930" y="750" font-size="32" fill="#ffffff">Exceptions, facts attached</text>

    <text x="900" y="840" font-size="26" fill="#cfe5f1">Hours back to order entry and quoting</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
