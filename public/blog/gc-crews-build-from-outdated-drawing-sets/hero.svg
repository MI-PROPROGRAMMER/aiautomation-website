<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Two timelines comparing five drawing revisions issued against the sheets actually held by the field crew">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.0"/>
    </linearGradient>
    <g id="sheetOn">
      <path d="M0 0 H44 L56 12 V42 H0 Z" fill="#00B5E2" fill-opacity="0.85"/>
      <path d="M44 0 V12 H56" fill="none" stroke="#001a36" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 22 H38 M10 31 H30" stroke="#001a36" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    </g>
    <g id="sheetOff">
      <path d="M0 0 H44 L56 12 V42 H0 Z" fill="none" stroke="#5e8aa6" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.9"/>
      <path d="M44 0 V12 H56" fill="none" stroke="#5e8aa6" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.9"/>
    </g>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.28">
    <path d="M150 125 H1400"/>
    <path d="M1290 125 V875"/>
  </g>

  <g transform="translate(150,215)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="98" font-size="80" font-weight="700" fill="#ffffff">The Sheet in the</text>
    <text y="182" font-size="80" font-weight="700" fill="#ffffff">Crew's Hands</text>
    <text y="244" font-size="36" font-weight="400" fill="#cfe5f1" opacity="0.9">a revision that reaches the office, but not the gang box</text>
  </g>

  <g transform="translate(190,560)" font-family="Georgia, serif">
    <text x="0" y="-34" font-size="14" letter-spacing="3" fill="#7fb6d6">ONE FLOOR, FIVE ISSUANCES  ·  WHAT WAS PUBLISHED VS WHAT WAS IN HAND</text>

    <rect x="640" y="62" width="470" height="102" rx="6" fill="#00B5E2" fill-opacity="0.07" stroke="#00B5E2" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="875" y="120" font-size="17" letter-spacing="2" fill="#cfe5f1" opacity="0.85" text-anchor="middle">REV C, D, AND E NEVER REACHED THE CREW</text>

    <path d="M300 31 H1180" stroke="#0a3a66" stroke-width="2"/>
    <text x="0" y="38" font-size="17" letter-spacing="1.5" fill="#7fb6d6">ISSUED</text>
    <g font-size="14" letter-spacing="2" fill="#7fb6d6" opacity="0.85">
      <text x="320" y="-4">REV A</text>
      <text x="500" y="-4">REV B</text>
      <text x="680" y="-4">REV C</text>
      <text x="860" y="-4">REV D</text>
      <text x="1040" y="-4">REV E</text>
    </g>
    <use href="#sheetOn" x="320" y="10"/>
    <use href="#sheetOn" x="500" y="10"/>
    <use href="#sheetOn" x="680" y="10"/>
    <use href="#sheetOn" x="860" y="10"/>
    <use href="#sheetOn" x="1040" y="10"/>

    <path d="M300 191 H1180" stroke="#0a3a66" stroke-width="2"/>
    <text x="0" y="198" font-size="17" letter-spacing="1.5" fill="#7fb6d6">IN HAND</text>
    <use href="#sheetOn" x="320" y="170"/>
    <use href="#sheetOn" x="500" y="170"/>
    <use href="#sheetOff" x="680" y="170"/>
    <use href="#sheetOff" x="860" y="170"/>
    <use href="#sheetOff" x="1040" y="170"/>

    <path d="M593 108 H628" stroke="#00B5E2" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M620 101 L631 108 L620 115 Z" fill="#00B5E2" fill-opacity="0.55"/>
    <text x="500" y="252" font-size="14" letter-spacing="2" fill="#cfe5f1" opacity="0.7">DIVERGENCE</text>

    <text x="0" y="252" font-size="13" letter-spacing="2" fill="#5e8aa6">FILLED = SHEET IN HAND</text>
    <text x="880" y="252" font-size="13" letter-spacing="2" fill="#5e8aa6">DASHED = PUBLISHED, NEVER RECEIVED IN THE FIELD</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
