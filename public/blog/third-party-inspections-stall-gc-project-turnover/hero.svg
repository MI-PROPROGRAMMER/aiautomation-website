<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00B5E2"/>
      <stop offset="0.85" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <text x="150" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>

  <text x="150" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="bold" fill="#ffffff">Where Third-Party Inspections</text>
  <text x="150" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="bold" fill="#ffffff">Stall GC Project Turnover</text>

  <text x="150" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#cfe5f1" fill-opacity="0.9">Planned inspection windows and where they actually land</text>

  <g transform="translate(150, 530)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="2" fill="#7fb6d6">CLOSEOUT INSPECTION LEDGER, DAYS FROM SUBSTANTIAL COMPLETION</text>

    <rect x="600" y="40" width="600" height="240" fill="#5e8aa6" fill-opacity="0.10"/>
    <line x1="600" y1="40" x2="600" y2="290" stroke="#7fb6d6" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.8"/>

    <text x="600" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#cfe5f1" fill-opacity="0.95">SUBSTANTIAL COMPLETION</text>
    <text x="900" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#7fb6d6">SCHEDULE SLIP</text>

    <g transform="translate(0, 55)">
      <text x="190" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">AHJ Rough-In</text>
      <rect x="280" y="4" width="80" height="20" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <rect x="360" y="4" width="80" height="20" fill="#00B5E2" rx="2"/>
    </g>

    <g transform="translate(0, 93)">
      <text x="190" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Firestopping</text>
      <rect x="400" y="4" width="80" height="20" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <rect x="560" y="4" width="120" height="20" fill="#00B5E2" rx="2"/>
    </g>

    <g transform="translate(0, 131)">
      <text x="190" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">TAB Sign-Off</text>
      <rect x="480" y="4" width="80" height="20" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <rect x="680" y="4" width="120" height="20" fill="#00B5E2" rx="2"/>
    </g>

    <g transform="translate(0, 169)">
      <text x="190" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Commissioning</text>
      <rect x="520" y="4" width="80" height="20" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <rect x="760" y="4" width="120" height="20" fill="#00B5E2" rx="2"/>
    </g>

    <g transform="translate(0, 207)">
      <text x="190" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Fire Marshal</text>
      <rect x="560" y="4" width="80" height="20" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <rect x="840" y="4" width="120" height="20" fill="#00B5E2" rx="2"/>
    </g>

    <g transform="translate(0, 245)">
      <text x="190" y="16" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Cert. of Occupancy</text>
      <rect x="600" y="4" width="80" height="20" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <rect x="960" y="4" width="120" height="20" fill="#00B5E2" rx="2"/>
    </g>

    <line x1="200" y1="290" x2="1200" y2="290" stroke="#5e8aa6" stroke-width="1" stroke-opacity="0.6"/>
    <text x="200" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#7fb6d6" fill-opacity="0.8">-10</text>
    <text x="400" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#7fb6d6" fill-opacity="0.8">-5</text>
    <text x="600" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#7fb6d6" fill-opacity="0.8">0</text>
    <text x="800" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#7fb6d6" fill-opacity="0.8">+5</text>
    <text x="1000" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#7fb6d6" fill-opacity="0.8">+10</text>
    <text x="1200" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#7fb6d6" fill-opacity="0.8">+15</text>

    <g transform="translate(200, 330)">
      <rect x="0" y="0" width="18" height="18" fill="#7fb6d6" fill-opacity="0.35" rx="2"/>
      <text x="26" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#cfe5f1">Planned window</text>
      <rect x="200" y="0" width="18" height="18" fill="#00B5E2" rx="2"/>
      <text x="226" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#cfe5f1">Actual outcome</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
