<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="When Permit Expediting Delays Slide GC Start Dates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="0.55" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#5e8aa6"/>
    </linearGradient>
    <linearGradient id="slipBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a66"/>
      <stop offset="1" stop-color="#00B5E2"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#00B5E2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="url(#bg)"/>

  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <text x="100" y="200" fill="#00B5E2" font-size="22" letter-spacing="6" font-weight="600">THE JOURNAL</text>
    <text x="100" y="230" fill="#7fb6d6" font-size="18" letter-spacing="3">CONSTRUCTION · GC PRECONSTRUCTION</text>
  </g>

  <g font-family="Georgia,'Times New Roman',serif" fill="#ffffff">
    <text x="100" y="360" font-size="82" font-weight="700">When Permit Delays</text>
    <text x="100" y="452" font-size="82" font-weight="700">Slide GC Start Dates</text>
  </g>

  <text x="100" y="520" font-family="Georgia,'Times New Roman',serif" fill="#cfe5f1" font-size="34" opacity="0.9">A quiet drag between owner GMP and the first mobilized crew.</text>

  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <g transform="translate(120,640)">
      <text x="0" y="0" fill="#7fb6d6" font-size="16" letter-spacing="3">PRECONSTRUCTION TIMELINE · WEEKS</text>

      <g transform="translate(0,40)">
        <line x1="0" y1="60" x2="1260" y2="60" stroke="#5e8aa6" stroke-opacity="0.4" stroke-width="1"/>

        <g fill="#5e8aa6" font-size="13" text-anchor="middle">
          <g transform="translate(0,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W1</text></g>
          <g transform="translate(140,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W3</text></g>
          <g transform="translate(280,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W5</text></g>
          <g transform="translate(420,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W7</text></g>
          <g transform="translate(560,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W9</text></g>
          <g transform="translate(700,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W11</text></g>
          <g transform="translate(840,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W13</text></g>
          <g transform="translate(980,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W15</text></g>
          <g transform="translate(1120,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W17</text></g>
          <g transform="translate(1260,60)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#5e8aa6"/><text y="26">W19</text></g>
        </g>

        <rect x="0" y="20" width="420" height="14" rx="2" fill="#0a3a66"/>
        <text x="0" y="12" fill="#7fb6d6" font-size="14">Modeled permit window</text>
        <g font-size="12" fill="#cfe5f1">
          <text x="0" y="52">Submit</text>
          <text x="420" y="52" text-anchor="end">Issue (Wk 6)</text>
        </g>

        <rect x="0" y="90" width="700" height="14" rx="2" fill="url(#slipBar)"/>
        <text x="0" y="82" fill="#00B5E2" font-size="14" font-weight="600">Actual permit window</text>
        <g font-size="12" fill="#cfe5f1">
          <text x="0" y="122">Submit</text>
          <text x="700" y="122" text-anchor="end">Issue (Wk 10)</text>
        </g>

        <g transform="translate(420,72)">
          <line x1="0" y1="0" x2="278" y2="0" stroke="#00B5E2" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowCyan)"/>
          <text x="140" y="-8" text-anchor="middle" fill="#00B5E2" font-size="14" font-weight="700" letter-spacing="2">SLIDE</text>
        </g>

        <g transform="translate(420,15)">
          <line x1="0" y1="0" x2="0" y2="105" stroke="#7fb6d6" stroke-width="1" stroke-dasharray="2 4"/>
        </g>
        <g transform="translate(700,15)">
          <line x1="0" y1="0" x2="0" y2="105" stroke="#00B5E2" stroke-width="1"/>
        </g>
      </g>
    </g>

    <g transform="translate(120,880)">
      <g transform="translate(0,0)">
        <rect x="0" y="-24" width="220" height="52" rx="6" fill="#0a3a66" stroke="#5e8aa6" stroke-width="1"/>
        <text x="16" y="-6" fill="#7fb6d6" font-size="12" letter-spacing="2">GC DRAG · PER DAY</text>
        <text x="16" y="22" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700">$2K–$4K</text>
      </g>
      <g transform="translate(260,0)">
        <rect x="0" y="-24" width="260" height="52" rx="6" fill="#0a3a66" stroke="#5e8aa6" stroke-width="1"/>
        <text x="16" y="-6" fill="#7fb6d6" font-size="12" letter-spacing="2">CONTINGENCY DRAW</text>
        <text x="16" y="22" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700">0.5–1.5% GMP</text>
      </g>
      <g transform="translate(560,0)">
        <rect x="0" y="-24" width="300" height="52" rx="6" fill="#0a3a66" stroke="#5e8aa6" stroke-width="1"/>
        <text x="16" y="-6" fill="#7fb6d6" font-size="12" letter-spacing="2">SLIDE ON MID-SIZE JOBS</text>
        <text x="16" y="22" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="700">3–4 weeks common</text>
      </g>
    </g>

    <g transform="translate(120,960)">
      <text x="0" y="0" fill="#7fb6d6" font-size="16" letter-spacing="3">APEXIFYLABS</text>
      <text x="1260" y="0" fill="#7fb6d6" font-size="16" letter-spacing="3" text-anchor="end">apexifylabs.com/blog</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
