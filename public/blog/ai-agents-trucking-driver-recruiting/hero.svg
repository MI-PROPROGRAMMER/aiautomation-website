<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="0.6" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="150" y="190" fill="#00B5E2" font-size="24" letter-spacing="6" font-family="Georgia, 'Times New Roman', serif">THE JOURNAL</text>
  <text x="150" y="290" fill="#ffffff" font-size="74" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">AI Agents on Driver Recruiting</text>
  <text x="150" y="360" fill="#cfe5f1" opacity="0.9" font-size="38" font-family="Georgia, 'Times New Roman', serif">The first carrier to reply usually gets the driver</text>
  <!-- Manual timeline -->
  <text x="150" y="500" fill="#7fb6d6" font-size="22" letter-spacing="3" font-family="Georgia, 'Times New Roman', serif">MANUAL DESK</text>
  <line x1="150" y1="560" x2="1350" y2="560" stroke="#5e8aa6" stroke-width="4"/>
  <circle cx="190" cy="560" r="16" fill="#cfe5f1"/>
  <text x="190" y="610" text-anchor="middle" fill="#cfe5f1" font-size="22" font-family="Georgia, 'Times New Roman', serif">Applies 9:04 PM</text>
  <circle cx="760" cy="560" r="10" fill="#5e8aa6"/>
  <text x="760" y="610" text-anchor="middle" fill="#5e8aa6" font-size="22" font-family="Georgia, 'Times New Roman', serif">Voicemail, day 2</text>
  <circle cx="1300" cy="560" r="16" fill="#0a3a66" stroke="#5e8aa6" stroke-width="3"/>
  <text x="1300" y="610" text-anchor="middle" fill="#5e8aa6" font-size="22" font-family="Georgia, 'Times New Roman', serif">Signed elsewhere</text>
  <!-- Agent timeline -->
  <text x="150" y="710" fill="#00B5E2" font-size="22" letter-spacing="3" font-family="Georgia, 'Times New Roman', serif">WITH AN AI AGENT</text>
  <line x1="150" y1="770" x2="1350" y2="770" stroke="#0a3a66" stroke-width="4"/>
  <line x1="190" y1="770" x2="700" y2="770" stroke="#00B5E2" stroke-width="6"/>
  <circle cx="190" cy="770" r="16" fill="#cfe5f1"/>
  <text x="190" y="820" text-anchor="middle" fill="#cfe5f1" font-size="22" font-family="Georgia, 'Times New Roman', serif">Applies 9:04 PM</text>
  <circle cx="330" cy="770" r="14" fill="#00B5E2"/>
  <text x="350" y="735" text-anchor="middle" fill="#00B5E2" font-size="22" font-family="Georgia, 'Times New Roman', serif">Reply 9:07 PM</text>
  <circle cx="520" cy="770" r="12" fill="#7fb6d6"/>
  <text x="520" y="820" text-anchor="middle" fill="#7fb6d6" font-size="22" font-family="Georgia, 'Times New Roman', serif">Pre-qualified</text>
  <circle cx="700" cy="770" r="16" fill="#00B5E2"/>
  <text x="760" y="735" text-anchor="middle" fill="#00B5E2" font-size="22" font-family="Georgia, 'Times New Roman', serif">Orientation booked</text>
  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
