<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="0.5" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#00B5E2"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="150" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>
  <text x="150" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#ffffff">Distributor Cash Application</text>
  <text x="150" y="365" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#cfe5f1" opacity="0.9">Matching payments to invoices with AI automation</text>

  <!-- Left: incoming payment + scattered remittances -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="150" y="470" width="300" height="110" rx="14" fill="#0a3a66" stroke="#00B5E2" stroke-width="3"/>
    <text x="180" y="515" font-size="24" fill="#7fb6d6">ACH DEPOSIT</text>
    <text x="180" y="558" font-size="34" font-weight="bold" fill="#ffffff">$48,212.60</text>

    <rect x="150" y="620" width="140" height="90" rx="10" fill="none" stroke="#5e8aa6" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="170" y="672" font-size="22" fill="#cfe5f1">Email PDF</text>
    <rect x="310" y="620" width="140" height="90" rx="10" fill="none" stroke="#5e8aa6" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="335" y="672" font-size="22" fill="#cfe5f1">Portal file</text>
    <rect x="230" y="730" width="140" height="90" rx="10" fill="none" stroke="#5e8aa6" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="250" y="782" font-size="22" fill="#cfe5f1">Check stub</text>
  </g>

  <!-- Center: matching engine -->
  <g>
    <path d="M470 600 C 560 600, 560 640, 640 640" stroke="#00B5E2" stroke-width="3" fill="none"/>
    <path d="M460 760 C 560 760, 560 660, 640 660" stroke="#00B5E2" stroke-width="3" fill="none" opacity="0.7"/>
    <circle cx="720" cy="650" r="78" fill="#002347" stroke="#00B5E2" stroke-width="4"/>
    <circle cx="720" cy="650" r="50" fill="none" stroke="#7fb6d6" stroke-width="2" stroke-dasharray="4 8"/>
    <text x="720" y="660" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#00B5E2">MATCH</text>
    <path d="M800 650 L 880 650" stroke="#00B5E2" stroke-width="3"/>
    <polygon points="880,640 900,650 880,660" fill="#00B5E2"/>
  </g>

  <!-- Right: invoice ledger rows -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="24">
    <rect x="920" y="470" width="430" height="360" rx="14" fill="#0a3a66" opacity="0.6"/>
    <text x="950" y="515" fill="#7fb6d6" letter-spacing="3" font-size="20">OPEN INVOICES</text>
    <g>
      <rect x="950" y="540" width="370" height="54" rx="8" fill="#002347"/>
      <circle cx="980" cy="567" r="12" fill="#00B5E2"/>
      <text x="1005" y="575" fill="#ffffff">INV 30418</text><text x="1300" y="575" text-anchor="end" fill="#cfe5f1">Applied</text>
    </g>
    <g>
      <rect x="950" y="606" width="370" height="54" rx="8" fill="#002347"/>
      <circle cx="980" cy="633" r="12" fill="#00B5E2"/>
      <text x="1005" y="641" fill="#ffffff">INV 30422</text><text x="1300" y="641" text-anchor="end" fill="#cfe5f1">Applied</text>
    </g>
    <g>
      <rect x="950" y="672" width="370" height="54" rx="8" fill="#002347"/>
      <circle cx="980" cy="699" r="12" fill="#00B5E2"/>
      <text x="1005" y="707" fill="#ffffff">INV 30431</text><text x="1300" y="707" text-anchor="end" fill="#cfe5f1">Applied</text>
    </g>
    <g>
      <rect x="950" y="738" width="370" height="54" rx="8" fill="#002347" stroke="#7fb6d6" stroke-width="2"/>
      <circle cx="980" cy="765" r="12" fill="none" stroke="#7fb6d6" stroke-width="3"/>
      <text x="1005" y="773" fill="#ffffff">Short-pay</text><text x="1300" y="773" text-anchor="end" fill="#7fb6d6">Review</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
