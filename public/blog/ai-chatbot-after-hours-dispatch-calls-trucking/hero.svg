<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="Overnight dispatch calls: routine questions answered by an AI chatbot, three escalated to the on-call dispatcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#001a36"/><stop offset="1" stop-color="#002347"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#002347"/><stop offset="0.35" stop-color="#00B5E2"/><stop offset="0.65" stop-color="#7fb6d6"/><stop offset="1" stop-color="#002347"/></linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <circle cx="1290" cy="230" r="46" fill="#cfe5f1" opacity="0.18"/>
  <circle cx="1310" cy="218" r="40" fill="#001a36"/>
  <text x="200" y="200" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="6">THE JOURNAL</text>
  <text x="200" y="300" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">After-Hours Dispatch,</text>
  <text x="200" y="390" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">Answered</text>
  <text x="200" y="460" fill="#cfe5f1" opacity="0.9" font-family="Georgia, 'Times New Roman', serif" font-size="38">The chatbot takes the lookups. People take the exceptions.</text>
  <line x1="200" y1="700" x2="1300" y2="700" stroke="#5e8aa6" stroke-width="3"/>
  <line x1="200" y1="700" x2="200" y2="716" stroke="#5e8aa6" stroke-width="2"/><text x="200" y="752" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="24" text-anchor="middle">10 PM</text><line x1="475" y1="700" x2="475" y2="716" stroke="#5e8aa6" stroke-width="2"/><text x="475" y="752" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="24" text-anchor="middle">12 AM</text><line x1="750" y1="700" x2="750" y2="716" stroke="#5e8aa6" stroke-width="2"/><text x="750" y="752" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="24" text-anchor="middle">2 AM</text><line x1="1025" y1="700" x2="1025" y2="716" stroke="#5e8aa6" stroke-width="2"/><text x="1025" y="752" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="24" text-anchor="middle">4 AM</text><line x1="1300" y1="700" x2="1300" y2="716" stroke="#5e8aa6" stroke-width="2"/><text x="1300" y="752" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="24" text-anchor="middle">6 AM</text><line x1="250" y1="700" x2="250" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="250" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="320" y1="700" x2="320" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="320" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="380" y1="700" x2="380" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="380" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="450" y1="700" x2="450" y2="560" stroke="#00B5E2" stroke-width="3"/><circle cx="450" cy="550" r="16" fill="#00B5E2"/><circle cx="450" cy="700" r="9" fill="#00B5E2"/><line x1="520" y1="700" x2="520" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="520" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="600" y1="700" x2="600" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="600" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="660" y1="700" x2="660" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="660" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="730" y1="700" x2="730" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="730" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="800" y1="700" x2="800" y2="560" stroke="#00B5E2" stroke-width="3"/><circle cx="800" cy="550" r="16" fill="#00B5E2"/><circle cx="800" cy="700" r="9" fill="#00B5E2"/><line x1="880" y1="700" x2="880" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="880" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="940" y1="700" x2="940" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="940" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="1010" y1="700" x2="1010" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="1010" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="1090" y1="700" x2="1090" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="1090" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/><line x1="1150" y1="700" x2="1150" y2="560" stroke="#00B5E2" stroke-width="3"/><circle cx="1150" cy="550" r="16" fill="#00B5E2"/><circle cx="1150" cy="700" r="9" fill="#00B5E2"/><line x1="1230" y1="700" x2="1230" y2="640" stroke="#0a3a66" stroke-width="3"/><circle cx="1230" cy="632" r="10" fill="#cfe5f1" opacity="0.8"/>
  <circle cx="220" cy="815" r="10" fill="#cfe5f1" opacity="0.8"/><text x="242" y="824" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="24">Answered by the chatbot</text>
  <circle cx="620" cy="815" r="14" fill="#00B5E2"/><text x="646" y="824" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="24">Escalated to on-call dispatcher</text>
  <rect x="0" y="994" width="1500" height="6" fill="url(#bar)"/>
