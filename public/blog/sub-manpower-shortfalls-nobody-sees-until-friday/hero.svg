<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#00B5E2" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#00B5E2" stop-opacity="1"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <text x="750" y="200" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="8">THE JOURNAL</text>

  <text x="750" y="322" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">Four Promised, Two Arrived</text>

  <text x="750" y="392" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill-opacity="0.9">the manpower gap most GC jobs discover on a Friday</text>

  <line x1="600" y1="440" x2="900" y2="440" stroke="#00B5E2" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="150" y="558" width="42" height="24" fill="none" stroke="#7fb6d6" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="206" y="578" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.85">committed</text>
  <rect x="150" y="612" width="42" height="24" fill="#00B5E2" fill-opacity="0.85"/>
  <text x="206" y="632" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.85">on site</text>

  <rect x="298" y="600" width="84" height="200" fill="none" stroke="#7fb6d6" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="298" y="610" width="84" height="190" fill="#00B5E2" fill-opacity="0.85"/>
  <text x="340" y="834" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.8">MON</text>

  <rect x="478" y="600" width="84" height="200" fill="none" stroke="#7fb6d6" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="478" y="672" width="84" height="128" fill="#00B5E2" fill-opacity="0.8"/>
  <text x="520" y="834" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.8">TUE</text>

  <rect x="658" y="600" width="84" height="200" fill="none" stroke="#7fb6d6" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="658" y="684" width="84" height="116" fill="#00B5E2" fill-opacity="0.75"/>
  <text x="700" y="834" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.8">WED</text>

  <rect x="838" y="600" width="84" height="200" fill="none" stroke="#7fb6d6" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="838" y="708" width="84" height="92" fill="#00B5E2" fill-opacity="0.7"/>
  <text x="880" y="834" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.8">THU</text>

  <rect x="1018" y="600" width="84" height="200" fill="none" stroke="#7fb6d6" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="7 6"/>
  <rect x="1018" y="716" width="84" height="84" fill="#00B5E2" fill-opacity="0.65"/>
  <text x="1060" y="834" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill-opacity="0.95">FRI</text>

  <line x1="270" y1="800" x2="1130" y2="800" stroke="#5e8aa6" stroke-opacity="0.7" stroke-width="2"/>

  <rect x="1180" y="540" width="210" height="300" fill="url(#window)"/>
  <text x="1285" y="522" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="3" fill-opacity="0.9">THE WEEKLY UPDATE</text>
  <text x="1285" y="668" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill-opacity="0.88">the gap becomes</text>
  <text x="1285" y="702" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill-opacity="0.88">visible here</text>
  <circle cx="1285" cy="762" r="13" fill="#00B5E2" fill-opacity="0.28" stroke="#00B5E2" stroke-opacity="0.95" stroke-width="3"/>

  <text x="700" y="878" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill-opacity="0.7">the promise is made on Thursday, the shortfall is measured a week later</text>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
