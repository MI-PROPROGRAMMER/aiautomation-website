<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a66"/>
      <stop offset="0.35" stop-color="#00B5E2"/>
      <stop offset="0.7" stop-color="#5e8aa6"/>
      <stop offset="1" stop-color="#00B5E2"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="150" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>
  <text x="150" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">AI Automation and the</text>
  <text x="150" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Three-Way Match Backlog</text>
  <text x="150" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#cfe5f1" opacity="0.9">Exceptions prepared for approval, not investigation</text>

  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- Three source documents -->
    <rect x="150" y="540" width="250" height="90" rx="12" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
    <text x="180" y="580" font-size="22" letter-spacing="3" fill="#7fb6d6">PURCHASE ORDER</text>
    <text x="180" y="613" font-size="26" fill="#ffffff">$41.20 / case</text>

    <rect x="150" y="650" width="250" height="90" rx="12" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2"/>
    <text x="180" y="690" font-size="22" letter-spacing="3" fill="#7fb6d6">RECEIPT</text>
    <text x="180" y="723" font-size="26" fill="#ffffff">48 cases</text>

    <rect x="150" y="760" width="250" height="90" rx="12" fill="#0a3a66" stroke="#00B5E2" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="180" y="800" font-size="22" letter-spacing="3" fill="#7fb6d6">INVOICE</text>
    <text x="180" y="833" font-size="26" fill="#ffffff">$43.75 x 50</text>

    <!-- Converging lines -->
    <path d="M400 585 Q520 585 600 690" fill="none" stroke="#5e8aa6" stroke-width="4"/>
    <path d="M400 695 L600 695" fill="none" stroke="#5e8aa6" stroke-width="4"/>
    <path d="M400 805 Q520 805 600 700" fill="none" stroke="#00B5E2" stroke-width="4"/>

    <!-- Agent node -->
    <circle cx="660" cy="695" r="62" fill="#001a36" stroke="#00B5E2" stroke-width="4"/>
    <circle cx="660" cy="695" r="30" fill="none" stroke="#00B5E2" stroke-width="3"/>
    <circle cx="660" cy="695" r="10" fill="#00B5E2"/>
    <text x="618" y="795" font-size="22" letter-spacing="3" fill="#cfe5f1">AGENT</text>

    <path d="M730 695 L820 695" stroke="#00B5E2" stroke-width="5"/>
    <path d="M810 680 L835 695 L810 710 Z" fill="#00B5E2"/>

    <!-- Recommendation card -->
    <rect x="860" y="550" width="500" height="300" rx="14" fill="#001a36" stroke="#00B5E2" stroke-width="3"/>
    <text x="890" y="600" font-size="22" letter-spacing="3" fill="#7fb6d6">READY FOR APPROVAL</text>
    <rect x="890" y="625" width="440" height="44" rx="6" fill="#0a3a66"/>
    <text x="910" y="656" font-size="24" fill="#ffffff">Price: new list not on PO</text>
    <rect x="890" y="682" width="440" height="44" rx="6" fill="#0a3a66"/>
    <text x="910" y="713" font-size="24" fill="#ffffff">Qty: 2 cases short at dock</text>
    <rect x="890" y="739" width="440" height="44" rx="6" fill="#0a3a66"/>
    <text x="910" y="770" font-size="24" fill="#ffffff">Credit request drafted</text>
    <rect x="890" y="798" width="150" height="34" rx="17" fill="#00B5E2"/>
    <text x="922" y="822" font-size="20" fill="#001a36">APPROVE</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
