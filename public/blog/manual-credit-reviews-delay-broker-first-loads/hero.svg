<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="manualBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e8aa6"/>
      <stop offset="1" stop-color="#0a3a66"/>
    </linearGradient>
    <linearGradient id="aiBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#0a3a66"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#00B5E2" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#00B5E2" stop-opacity="1"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <text x="750" y="205" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="8">THE JOURNAL</text>

  <text x="750" y="325" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">First-Load Credit</text>
  <text x="750" y="405" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="bold">Review Clock</text>

  <text x="750" y="470" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill-opacity="0.9">hours from quote to bookable, on a broker desk</text>

  <line x1="220" y1="540" x2="220" y2="800" stroke="#5e8aa6" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="432" y1="540" x2="432" y2="800" stroke="#5e8aa6" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="644" y1="540" x2="644" y2="800" stroke="#5e8aa6" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="856" y1="540" x2="856" y2="800" stroke="#5e8aa6" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1068" y1="540" x2="1068" y2="800" stroke="#5e8aa6" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="1280" y1="540" x2="1280" y2="800" stroke="#5e8aa6" stroke-opacity="0.15" stroke-width="1"/>

  <text x="326" y="565" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill-opacity="0.95">MON</text>
  <text x="538" y="565" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill-opacity="0.7">TUE</text>
  <text x="750" y="565" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill-opacity="0.7">WED</text>
  <text x="962" y="565" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill-opacity="0.7">THU</text>
  <text x="1174" y="565" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" fill-opacity="0.7">FRI</text>

  <text x="326" y="600" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill-opacity="0.85">quote in</text>

  <text x="220" y="655" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="3" fill-opacity="0.85">MANUAL DESK</text>
  <rect x="220" y="675" width="848" height="32" fill="url(#manualBar)" rx="4"/>
  <text x="240" y="696" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill-opacity="0.85">app intake, references, D&amp;B pull, committee wait, TMS setup</text>
  <text x="1088" y="696" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill-opacity="0.9">72h</text>

  <text x="220" y="745" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="3" fill-opacity="0.95">AI-ASSISTED DESK</text>
  <rect x="220" y="765" width="130" height="32" fill="url(#aiBar)" rx="4"/>
  <text x="370" y="786" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill-opacity="0.95">same-day decision</text>

  <line x1="220" y1="840" x2="1280" y2="840" stroke="#5e8aa6" stroke-opacity="0.25" stroke-width="1"/>
  <text x="750" y="870" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill-opacity="0.75">a shipper's first-load window rarely stays open past 48 hours</text>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
