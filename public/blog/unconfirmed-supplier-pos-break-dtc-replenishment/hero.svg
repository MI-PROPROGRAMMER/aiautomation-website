<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Planned versus actual supplier purchase order timeline showing lead time drift past the reorder point">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="plannedBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="actualBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb6d6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5e8aa6" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.32">
    <path d="M0 210 H1500"/><path d="M0 400 H1500"/>
    <path d="M0 590 H1500"/><path d="M0 780 H1500"/>
  </g>

  <g transform="translate(180,235)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="102" font-size="80" font-weight="700" fill="#ffffff">The Unconfirmed PO</text>
    <text y="172" font-size="38" font-weight="400" fill="#cfe5f1" opacity="0.9">when the ship date moves and nobody hears about it</text>
  </g>

  <g transform="translate(180,520)" font-family="Georgia, serif">
    <text font-size="14" letter-spacing="3" fill="#7fb6d6">REPLENISHMENT TIMELINE, ONE SKU</text>

    <g transform="translate(0,44)">
      <line x1="0" y1="212" x2="1060" y2="212" stroke="#0a3a66" stroke-width="1.5"/>

      <text x="0" y="18" font-size="17" fill="#cfe5f1" opacity="0.9">PO issued, planned receipt</text>
      <rect x="0" y="30" width="560" height="34" rx="4" fill="url(#plannedBar)"/>
      <text x="576" y="53" font-size="16" fill="#00B5E2">on plan</text>

      <text x="0" y="112" font-size="17" fill="#cfe5f1" opacity="0.9">What the supplier actually confirmed</text>
      <rect x="0" y="124" width="560" height="34" rx="4" fill="url(#actualBar)"/>
      <rect x="560" y="124" width="300" height="34" rx="4" fill="none" stroke="#7fb6d6" stroke-width="2" stroke-dasharray="9 7" opacity="0.85"/>
      <text x="710" y="114" font-size="15" fill="#7fb6d6" text-anchor="middle">lead time drift</text>
      <text x="876" y="147" font-size="16" fill="#7fb6d6">receipt lands here</text>

      <line x1="660" y1="6" x2="660" y2="196" stroke="#00B5E2" stroke-width="1.6" stroke-dasharray="4 5" opacity="0.8"/>
      <circle cx="660" cy="196" r="6" fill="#00B5E2"/>
      <text x="660" y="234" font-size="15" fill="#cfe5f1" text-anchor="middle" opacity="0.9">reorder point trips</text>

      <path d="M560 178 V190 H860 V178" fill="none" stroke="#5e8aa6" stroke-width="1.6"/>
    </g>

    <g transform="translate(0,296)">
      <rect x="0" y="-24" width="6" height="34" fill="#00B5E2" opacity="0.8"/>
      <text x="22" y="0" font-size="19" fill="#cfe5f1" opacity="0.92">Lead time drift is discovered after the plan already depended on it</text>
      <text x="22" y="34" font-size="13" letter-spacing="2" fill="#5e8aa6">SILENCE READS AS AGREEMENT · AN UNANSWERED PO IS NOT AN EVENT IN ANY SYSTEM</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
