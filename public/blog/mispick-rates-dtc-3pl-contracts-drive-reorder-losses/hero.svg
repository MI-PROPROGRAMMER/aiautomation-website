<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Mispick rates and DTC reorder loss visualization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.75" r="0.6">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cleanCurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mispickCurve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb6d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5e8aa6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.35">
    <path d="M0 220 H1500"/><path d="M0 400 H1500"/>
    <path d="M0 580 H1500"/><path d="M0 760 H1500"/>
  </g>

  <g transform="translate(180,240)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="100" font-size="76" font-weight="700" fill="#ffffff">The Reorder Gap</text>
    <text y="170" font-size="38" font-weight="400" fill="#cfe5f1" opacity="0.9">what wrong-item shipments cost after the reship</text>
  </g>

  <g transform="translate(180,530)" font-family="Georgia, serif">
    <text font-size="14" letter-spacing="3" fill="#7fb6d6">90-DAY REORDER RATE, SAME ACQUISITION COHORT</text>

    <g transform="translate(0,40)">
      <line x1="90" y1="240" x2="960" y2="240" stroke="#0a3a66" stroke-width="1.5"/>
      <line x1="90" y1="20" x2="90" y2="240" stroke="#0a3a66" stroke-width="1.5"/>

      <text x="70" y="30" font-size="12" fill="#5e8aa6" text-anchor="end">100%</text>
      <text x="70" y="135" font-size="12" fill="#5e8aa6" text-anchor="end">50%</text>
      <text x="70" y="245" font-size="12" fill="#5e8aa6" text-anchor="end">0%</text>

      <text x="90" y="264" font-size="12" fill="#5e8aa6">Day 0</text>
      <text x="380" y="264" font-size="12" fill="#5e8aa6" text-anchor="middle">Day 30</text>
      <text x="670" y="264" font-size="12" fill="#5e8aa6" text-anchor="middle">Day 60</text>
      <text x="960" y="264" font-size="12" fill="#5e8aa6" text-anchor="end">Day 90</text>

      <path d="M90 235 C 250 210, 420 165, 590 130 S 850 78, 960 62"
            fill="none" stroke="url(#cleanCurve)" stroke-width="4"/>
      <circle cx="960" cy="62" r="6" fill="#00B5E2"/>
      <text x="985" y="60" font-size="18" font-weight="700" fill="#cfe5f1">Clean-ship</text>
      <text x="985" y="82" font-size="14" fill="#7fb6d6">reorder baseline</text>

      <path d="M90 235 C 250 222, 420 200, 590 178 S 850 145, 960 132"
            fill="none" stroke="url(#mispickCurve)" stroke-width="4" stroke-dasharray="8 6"/>
      <circle cx="960" cy="132" r="6" fill="#7fb6d6"/>
      <text x="985" y="130" font-size="18" font-weight="700" fill="#cfe5f1">Wrong-item</text>
      <text x="985" y="152" font-size="14" fill="#7fb6d6">20 to 40% lower</text>

      <line x1="960" y1="70" x2="960" y2="124" stroke="#00B5E2" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.75"/>
    </g>

    <g transform="translate(0,340)">
      <text font-size="12" letter-spacing="2" fill="#5e8aa6">RESHIP CREDIT MAKES THE INVOICE WHOLE · THE REORDER RATE DOES NOT RECOVER ON ITS OWN</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
