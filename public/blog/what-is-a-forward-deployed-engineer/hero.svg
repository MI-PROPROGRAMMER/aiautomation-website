<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Traditional vendor delivery relay compared with a forward deployed engineer embedded inside the customer operation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.22" r="0.58">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="fdeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.62"/>
    </linearGradient>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e8aa6"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#00B5E2"/>
    </marker>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.32">
    <path d="M0 210 H1500"/><path d="M0 400 H1500"/><path d="M0 640 H1500"/><path d="M0 830 H1500"/>
  </g>

  <g transform="translate(180,230)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="98" font-size="84" font-weight="700" fill="#ffffff">What Is a Forward</text>
    <text y="186" font-size="84" font-weight="700" fill="#ffffff">Deployed Engineer?</text>
    <text y="252" font-size="36" font-weight="400" fill="#cfe5f1" opacity="0.9">the role, the skills, and why 2026 needs it</text>
  </g>

  <g transform="translate(180,545)" font-family="Georgia, serif">

    <g>
      <text font-size="14" letter-spacing="3" fill="#7fb6d6">TRADITIONAL DELIVERY  ·  FOUR HOPS FROM PROBLEM TO SOFTWARE</text>
      <g transform="translate(0,20)">
        <rect x="0" y="0" width="180" height="56" fill="#0a3a66" opacity="0.7" stroke="#5e8aa6" stroke-width="1.5"/>
        <text x="90" y="34" font-size="16" fill="#cfe5f1" text-anchor="middle">VENDOR</text>

        <path d="M188 28 H952" stroke="#5e8aa6" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.8" marker-end="url(#arrowDim)"/>
        <g fill="#001a36" stroke="#5e8aa6" stroke-width="1.5">
          <circle cx="330" cy="28" r="9"/><circle cx="500" cy="28" r="9"/>
          <circle cx="670" cy="28" r="9"/><circle cx="840" cy="28" r="9"/>
        </g>
        <g font-size="13" fill="#7fb6d6" text-anchor="middle" letter-spacing="1">
          <text x="330" y="56">SPEC</text><text x="500" y="56">BACKLOG</text>
          <text x="670" y="56">RELEASE</text><text x="840" y="56">GO-LIVE</text>
        </g>

        <rect x="960" y="0" width="180" height="56" fill="#0a3a66" opacity="0.7" stroke="#5e8aa6" stroke-width="1.5"/>
        <text x="1050" y="34" font-size="16" fill="#cfe5f1" text-anchor="middle">OPERATION</text>
      </g>
      <text y="112" font-size="13" fill="#5e8aa6" letter-spacing="1">DETAIL LOST AT EVERY HOP · THE EXCEPTIONS NEVER MAKE IT INTO THE SPEC</text>
    </g>

    <g transform="translate(0,152)">
      <text font-size="14" letter-spacing="3" fill="#00B5E2" opacity="0.9">FORWARD DEPLOYED  ·  THE ENGINEER SITS INSIDE THE OPERATION</text>
      <g transform="translate(0,20)">
        <rect x="0" y="0" width="180" height="56" fill="#0a3a66" opacity="0.7" stroke="#5e8aa6" stroke-width="1.5"/>
        <text x="90" y="34" font-size="16" fill="#cfe5f1" text-anchor="middle">VENDOR</text>

        <path d="M188 28 H352" stroke="#00B5E2" stroke-width="2" marker-end="url(#arrowCyan)"/>

        <rect x="362" y="-14" width="778" height="84" fill="#00B5E2" opacity="0.05"/>
        <rect x="362" y="-14" width="778" height="84" fill="none" stroke="#00B5E2" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.75"/>
        <text x="1140" y="-24" font-size="12" letter-spacing="2" fill="#00B5E2" text-anchor="end" opacity="0.9">CUSTOMER OPERATION</text>

        <rect x="386" y="0" width="196" height="56" fill="url(#fdeFill)"/>
        <text x="484" y="34" font-size="16" font-weight="700" fill="#001a36" text-anchor="middle">ENGINEER</text>

        <g fill="#0a3a66" fill-opacity="0.7" stroke="#00B5E2" stroke-width="1.2" stroke-opacity="0.55">
          <rect x="614" y="0" width="164" height="56"/><rect x="794" y="0" width="164" height="56"/><rect x="974" y="0" width="142" height="56"/>
        </g>
        <g font-size="15" fill="#cfe5f1" text-anchor="middle">
          <text x="696" y="34">OPS TEAM</text><text x="876" y="34">LIVE DATA</text><text x="1045" y="34">EXCEPTIONS</text>
        </g>
        <g stroke="#00B5E2" stroke-width="1.5" opacity="0.7">
          <path d="M582 28 H612"/><path d="M778 28 H792"/><path d="M958 28 H972"/>
        </g>
      </g>
      <text y="112" font-size="13" fill="#00B5E2" opacity="0.85" letter-spacing="1">ONE HOP · DECISIONS MADE IN HOURS · OWNED THROUGH DEPLOYMENT</text>
    </g>

    <text y="308" font-size="12" letter-spacing="2" fill="#5e8aa6">THE BOTTLENECK MOVED FROM MODEL CAPABILITY TO DEPLOYMENT CONTEXT</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
