<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="DDP vs DAP cross-border shipping visualization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.24" r="0.55">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#00B5E2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="ddpFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="dapFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e8aa6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5e8aa6" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <g stroke="#0a3a66" stroke-width="1" opacity="0.35">
    <path d="M0 220 H1500" /><path d="M0 380 H1500" /><path d="M0 540 H1500" />
    <path d="M0 700 H1500" /><path d="M0 860 H1500" />
  </g>

  <g transform="translate(180,240)" font-family="Georgia, 'Times New Roman', serif">
    <text font-size="22" letter-spacing="6" fill="#00B5E2" opacity="0.85">THE JOURNAL</text>
    <text y="100" font-size="84" font-weight="700" fill="#ffffff">DDP vs DAP Shipping</text>
    <text y="170" font-size="38" font-weight="400" fill="#cfe5f1" opacity="0.9">the DTC cross-border margin story</text>
  </g>

  <g transform="translate(180,560)" font-family="Georgia, serif">
    <text font-size="14" letter-spacing="3" fill="#7fb6d6">LANDED-COST COMPOSITION PER ORDER</text>

    <g transform="translate(0,50)">
      <text font-size="16" fill="#cfe5f1">DDP  ·  duty collected at checkout</text>
      <g transform="translate(0,18)">
        <rect x="0" y="0" width="1140" height="30" fill="#0a3a66" opacity="0.7"/>
        <rect x="0" y="0" width="620" height="30" fill="url(#ddpFill)"/>
        <rect x="620" y="0" width="240" height="30" fill="#00B5E2" opacity="0.45"/>
        <rect x="860" y="0" width="200" height="30" fill="#00B5E2" opacity="0.28"/>
        <rect x="1060" y="0" width="80" height="30" fill="#cfe5f1" opacity="0.55"/>
        <text x="10" y="20" font-size="13" fill="#001a36" font-weight="700">PRODUCT</text>
        <text x="628" y="20" font-size="13" fill="#001a36" font-weight="700">SHIP</text>
        <text x="868" y="20" font-size="13" fill="#001a36" font-weight="700">DUTY</text>
        <text x="1068" y="20" font-size="13" fill="#001a36" font-weight="700">TAX</text>
      </g>
      <text x="0" y="72" font-size="13" fill="#7fb6d6" letter-spacing="1">SELLER OWNS THE GAP · CUSTOMER SEES ONE PRICE</text>
    </g>

    <g transform="translate(0,180)">
      <text font-size="16" fill="#cfe5f1">DAP  ·  duty billed at delivery</text>
      <g transform="translate(0,18)">
        <rect x="0" y="0" width="1140" height="30" fill="#0a3a66" opacity="0.7"/>
        <rect x="0" y="0" width="620" height="30" fill="url(#dapFill)"/>
        <rect x="620" y="0" width="240" height="30" fill="#5e8aa6" opacity="0.4"/>
        <text x="10" y="20" font-size="13" fill="#001a36" font-weight="700">PRODUCT</text>
        <text x="628" y="20" font-size="13" fill="#001a36" font-weight="700">SHIP</text>
      </g>
      <g transform="translate(870,0)">
        <rect x="0" y="18" width="270" height="30" fill="none" stroke="#00B5E2" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"/>
        <text x="10" y="38" font-size="13" fill="#00B5E2" font-weight="700">DUTY + TAX AT DOOR</text>
      </g>
      <text x="0" y="72" font-size="13" fill="#7fb6d6" letter-spacing="1">CUSTOMER OWNS THE SURPRISE · REFUSAL RATE TICKS UP</text>
    </g>

    <g transform="translate(0,320)">
      <text font-size="12" letter-spacing="2" fill="#5e8aa6">HTS DRIFT · RATE SNAPSHOT LAG · UNCLAIMED RETURN DUTY = LANDED-COST GAP</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
