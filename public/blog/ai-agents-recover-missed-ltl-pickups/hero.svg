<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="AI Agents That Recover Missed LTL Pickups">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a66"/>
      <stop offset="0.5" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#0a3a66"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="150" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#00B5E2" letter-spacing="6">THE JOURNAL</text>
  <text x="150" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">AI Agents That Recover</text>
  <text x="150" y="415" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Missed LTL Pickups</text>
  <text x="150" y="485" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#cfe5f1" opacity="0.9">Catch the miss the same afternoon, not the next morning</text>
  <!-- route of pickup stops -->
  <line x1="190" y1="680" x2="1310" y2="680" stroke="#5e8aa6" stroke-width="4" stroke-dasharray="14 12"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#7fb6d6" text-anchor="middle">
    <circle cx="190" cy="680" r="22" fill="#0a3a66" stroke="#7fb6d6" stroke-width="4"/>
    <text x="190" y="745">Stop 1</text>
    <circle cx="410" cy="680" r="22" fill="#0a3a66" stroke="#7fb6d6" stroke-width="4"/>
    <text x="410" y="745">Stop 2</text>
    <circle cx="630" cy="680" r="30" fill="#002347" stroke="#00B5E2" stroke-width="5"/>
    <line x1="616" y1="666" x2="644" y2="694" stroke="#00B5E2" stroke-width="5"/>
    <line x1="644" y1="666" x2="616" y2="694" stroke="#00B5E2" stroke-width="5"/>
    <text x="630" y="755" fill="#cfe5f1">No status</text>
    <circle cx="850" cy="680" r="22" fill="#0a3a66" stroke="#7fb6d6" stroke-width="4"/>
    <text x="850" y="745">Stop 4</text>
    <circle cx="1070" cy="680" r="22" fill="#0a3a66" stroke="#7fb6d6" stroke-width="4"/>
    <text x="1070" y="745">Stop 5</text>
    <rect x="1250" y="650" width="120" height="60" rx="8" fill="#0a3a66" stroke="#7fb6d6" stroke-width="4"/>
    <text x="1310" y="745">Terminal</text>
  </g>
  <!-- recovery arc -->
  <path d="M630 645 C 700 540, 1000 540, 1070 645" fill="none" stroke="#00B5E2" stroke-width="5"/>
  <polygon points="1070,652 1056,628 1082,632" fill="#00B5E2"/>
  <rect x="740" y="560" width="220" height="44" rx="22" fill="#002347" stroke="#00B5E2" stroke-width="3"/>
  <text x="850" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#ffffff" text-anchor="middle">Rebooked same day</text>
  <rect x="0" y="994" width="1500" height="6" fill="url(#bar)"/>
</svg>
