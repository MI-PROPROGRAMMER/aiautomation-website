<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3a66"/>
      <stop offset="0.35" stop-color="#00B5E2"/>
      <stop offset="0.7" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#0a3a66"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="150" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>
  <text x="150" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">AI Agents vs Manual</text>
  <text x="150" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">AR Collections</text>
  <text x="150" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#cfe5f1" opacity="0.9">Unblocking overdue invoices at distributors</text>

  <!-- Aging buckets: before (tall late buckets) vs after (shifted to current) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="22">
    <text x="150" y="560" fill="#7fb6d6" letter-spacing="3">MANUAL DESK</text>
    <line x1="150" y1="830" x2="640" y2="830" stroke="#5e8aa6" stroke-width="2"/>
    <rect x="170" y="700" width="80" height="130" fill="#5e8aa6"/>
    <rect x="290" y="660" width="80" height="170" fill="#5e8aa6"/>
    <rect x="410" y="620" width="80" height="210" fill="#7fb6d6"/>
    <rect x="530" y="600" width="80" height="230" fill="#cfe5f1"/>
    <text x="185" y="865" fill="#cfe5f1">0-30</text>
    <text x="300" y="865" fill="#cfe5f1">31-60</text>
    <text x="420" y="865" fill="#cfe5f1">61-90</text>
    <text x="550" y="865" fill="#cfe5f1">90+</text>

    <path d="M690 715 L790 715" stroke="#00B5E2" stroke-width="5"/>
    <path d="M780 700 L805 715 L780 730 Z" fill="#00B5E2"/>

    <text x="850" y="560" fill="#00B5E2" letter-spacing="3">WITH AI AGENTS</text>
    <line x1="850" y1="830" x2="1340" y2="830" stroke="#5e8aa6" stroke-width="2"/>
    <rect x="870" y="590" width="80" height="240" fill="#00B5E2"/>
    <rect x="990" y="730" width="80" height="100" fill="#0a3a66" stroke="#00B5E2" stroke-width="2"/>
    <rect x="1110" y="780" width="80" height="50" fill="#0a3a66" stroke="#00B5E2" stroke-width="2"/>
    <rect x="1230" y="805" width="80" height="25" fill="#0a3a66" stroke="#00B5E2" stroke-width="2"/>
    <text x="885" y="865" fill="#cfe5f1">0-30</text>
    <text x="1000" y="865" fill="#cfe5f1">31-60</text>
    <text x="1120" y="865" fill="#cfe5f1">61-90</text>
    <text x="1250" y="865" fill="#cfe5f1">90+</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
