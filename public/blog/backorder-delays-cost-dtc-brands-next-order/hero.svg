<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-label="Backorder Delays Cost DTC Brands the Next Order">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00B5E2"/>
      <stop offset="0.75" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="baseline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#7fb6d6"/>
    </linearGradient>
    <linearGradient id="cohort" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe5f1"/>
      <stop offset="0.4" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#5e8aa6"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <g opacity="0.15" stroke="#0a3a66" stroke-width="1">
    <line x1="150" y1="620" x2="1350" y2="620"/>
    <line x1="150" y1="720" x2="1350" y2="720"/>
    <line x1="150" y1="820" x2="1350" y2="820"/>
  </g>

  <text x="150" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#00B5E2" letter-spacing="6">THE JOURNAL</text>

  <text x="150" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#ffffff">Backorder Delays</text>
  <text x="150" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#ffffff">Cost DTC Brands</text>
  <text x="150" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#00B5E2">the Next Order.</text>

  <text x="150" y="585" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#cfe5f1" fill-opacity="0.9" font-style="italic">The retention arithmetic mid-size DTC brands rarely price in.</text>

  <g transform="translate(150,620)" font-family="Georgia, 'Times New Roman', serif">
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#5e8aa6" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="240" stroke="#5e8aa6" stroke-width="2" opacity="0.5"/>

    <text x="-8" y="10" font-size="16" fill="#7fb6d6" text-anchor="end">Repeat rate</text>
    <text x="-8" y="245" font-size="16" fill="#7fb6d6" text-anchor="end">0%</text>

    <text x="0" y="266" font-size="16" fill="#7fb6d6">Order 1</text>
    <text x="400" y="266" font-size="16" fill="#7fb6d6" text-anchor="middle">30 days</text>
    <text x="800" y="266" font-size="16" fill="#7fb6d6" text-anchor="middle">60 days</text>
    <text x="1200" y="266" font-size="16" fill="#7fb6d6" text-anchor="end">90 days</text>

    <path d="M 0 60 C 300 55, 600 50, 1200 46" fill="none" stroke="url(#baseline)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1200" cy="46" r="9" fill="#00B5E2"/>
    <text x="1215" y="52" font-size="20" fill="#00B5E2" font-weight="700">Baseline cohort</text>

    <path d="M 0 60 C 300 100, 600 150, 1200 175" fill="none" stroke="url(#cohort)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10"/>
    <circle cx="1200" cy="175" r="9" fill="#cfe5f1"/>
    <text x="1215" y="181" font-size="20" fill="#cfe5f1">Backorder cohort</text>

    <g transform="translate(0,60)">
      <circle r="7" fill="#ffffff"/>
      <text x="12" y="-12" font-size="16" fill="#cfe5f1">Same starting point</text>
    </g>

    <line x1="1155" y1="46" x2="1155" y2="175" stroke="#00B5E2" stroke-width="2" opacity="0.6"/>
    <text x="1145" y="115" font-size="18" fill="#00B5E2" text-anchor="end" font-style="italic">the gap</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
