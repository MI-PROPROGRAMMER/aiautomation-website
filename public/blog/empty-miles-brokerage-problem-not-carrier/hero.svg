<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#00B5E2" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#00B5E2" stop-opacity="1"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <text x="750" y="200" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="8">THE JOURNAL</text>

  <text x="750" y="322" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">The Mile After Delivery</text>

  <text x="750" y="392" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill-opacity="0.9">an empty backhaul is a coverage decision, not a carrier cost</text>

  <line x1="600" y1="440" x2="900" y2="440" stroke="#00B5E2" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="1050" y="530" width="190" height="280" fill="url(#window)"/>
  <text x="1145" y="512" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="3" fill-opacity="0.9">THE RELOAD WINDOW</text>

  <path d="M 300 636 Q 720 496 1140 636" fill="none" stroke="#00B5E2" stroke-opacity="0.85" stroke-width="4"/>
  <polygon points="1140,636 1112,616 1116,644" fill="#00B5E2" fill-opacity="0.85"/>
  <text x="700" y="562" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill-opacity="0.88">loaded leg: quoted, covered, measured</text>

  <path d="M 1140 694 Q 720 834 300 694" fill="none" stroke="#5e8aa6" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="16 14"/>
  <polygon points="300,694 328,674 324,702" fill="#5e8aa6" fill-opacity="0.7"/>
  <text x="700" y="806" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill-opacity="0.75">empty leg: absorbed by the carrier, unrecorded by the broker</text>

  <circle cx="300" cy="665" r="14" fill="#0a3a66" stroke="#7fb6d6" stroke-opacity="0.85" stroke-width="3"/>
  <text x="300" y="612" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill-opacity="0.85">origin market</text>

  <circle cx="1140" cy="665" r="16" fill="#00B5E2" fill-opacity="0.28" stroke="#00B5E2" stroke-opacity="0.95" stroke-width="3"/>
  <text x="1145" y="612" text-anchor="middle" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill-opacity="0.85">delivery</text>
  <text x="1145" y="742" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill-opacity="0.85">hours left, still</text>
  <text x="1145" y="768" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill-opacity="0.85">deciding</text>

  <text x="750" y="866" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill-opacity="0.7">the offer has to exist before the truck empties out, not after</text>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
