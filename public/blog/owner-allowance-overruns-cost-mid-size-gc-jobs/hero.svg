<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00B5E2"/>
      <stop offset="0.85" stop-color="#00B5E2"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>

  <text x="150" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>

  <text x="150" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Owner Allowance</text>
  <text x="150" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#ffffff">Overruns</text>

  <text x="150" y="475" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#cfe5f1" fill-opacity="0.9">The closeout write-off on mid-size GC jobs</text>

  <g transform="translate(150, 540)">
    <text x="0" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="2" fill="#7fb6d6">ALLOWANCE VS ACTUAL INVOICED, PER LINE ITEM</text>

    <g transform="translate(0, 60)">
      <line x1="0" y1="180" x2="1200" y2="180" stroke="#5e8aa6" stroke-width="1" stroke-opacity="0.5"/>

      <g transform="translate(30, 0)">
        <rect x="0" y="90" width="55" height="90" fill="#7fb6d6" fill-opacity="0.7"/>
        <rect x="65" y="65" width="55" height="115" fill="#00B5E2"/>
        <text x="60" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Appliances</text>
      </g>

      <g transform="translate(220, 0)">
        <rect x="0" y="70" width="55" height="110" fill="#7fb6d6" fill-opacity="0.7"/>
        <rect x="65" y="35" width="55" height="145" fill="#00B5E2"/>
        <text x="60" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Finishes</text>
      </g>

      <g transform="translate(410, 0)">
        <rect x="0" y="110" width="55" height="70" fill="#7fb6d6" fill-opacity="0.7"/>
        <rect x="65" y="90" width="55" height="90" fill="#00B5E2"/>
        <text x="60" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Fixtures</text>
      </g>

      <g transform="translate(600, 0)">
        <rect x="0" y="50" width="55" height="130" fill="#7fb6d6" fill-opacity="0.7"/>
        <rect x="65" y="10" width="55" height="170" fill="#00B5E2"/>
        <text x="60" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Landscape</text>
      </g>

      <g transform="translate(790, 0)">
        <rect x="0" y="80" width="55" height="100" fill="#7fb6d6" fill-opacity="0.7"/>
        <rect x="65" y="45" width="55" height="135" fill="#00B5E2"/>
        <text x="60" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Specialty Eq.</text>
      </g>

      <g transform="translate(980, 0)">
        <rect x="0" y="125" width="55" height="55" fill="#7fb6d6" fill-opacity="0.7"/>
        <rect x="65" y="100" width="55" height="80" fill="#00B5E2"/>
        <text x="60" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Signage</text>
      </g>
    </g>

    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="18" height="18" fill="#7fb6d6" fill-opacity="0.7"/>
      <text x="26" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Allowance</text>
      <rect x="150" y="0" width="18" height="18" fill="#00B5E2"/>
      <text x="176" y="14" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#cfe5f1">Actual invoiced</text>
    </g>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
