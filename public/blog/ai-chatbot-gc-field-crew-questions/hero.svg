<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2"/>
      <stop offset="0.35" stop-color="#0a3a66"/>
      <stop offset="0.7" stop-color="#7fb6d6"/>
      <stop offset="1" stop-color="#00B5E2"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <text x="750" y="196" text-anchor="middle" fill="#00B5E2" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="6">THE JOURNAL</text>
  <text x="750" y="306" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold">Ask the Job First</text>
  <text x="750" y="372" text-anchor="middle" fill="#cfe5f1" fill-opacity="0.9" font-family="Georgia, 'Times New Roman', serif" font-size="36">field questions answered from approved documents</text>

  <!-- phone frame -->
  <rect x="520" y="430" width="460" height="420" rx="36" fill="#001a36" stroke="#0a3a66" stroke-width="4"/>
  <rect x="690" y="448" width="120" height="8" rx="4" fill="#0a3a66"/>

  <!-- question bubble (foreman) -->
  <rect x="550" y="480" width="330" height="96" rx="20" fill="#0a3a66"/>
  <text x="572" y="518" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="22">Which tile was approved</text>
  <text x="572" y="552" fill="#cfe5f1" font-family="Georgia, 'Times New Roman', serif" font-size="22">for the L2 restrooms?</text>

  <!-- answer bubble (chatbot) -->
  <rect x="620" y="604" width="330" height="96" rx="20" fill="#00B5E2"/>
  <text x="642" y="642" fill="#001a36" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold">Porcelain, 12x24, matte.</text>
  <text x="642" y="676" fill="#001a36" font-family="Georgia, 'Times New Roman', serif" font-size="22">Approved resubmittal</text>

  <!-- source chip -->
  <rect x="700" y="724" width="250" height="44" rx="22" fill="none" stroke="#7fb6d6" stroke-width="2"/>
  <text x="825" y="753" text-anchor="middle" fill="#7fb6d6" font-family="Georgia, 'Times New Roman', serif" font-size="20">source linked</text>

  <!-- left: PM phone, muted -->
  <g opacity="0.55">
    <circle cx="300" cy="640" r="70" fill="none" stroke="#5e8aa6" stroke-width="3"/>
    <text x="300" y="634" text-anchor="middle" fill="#5e8aa6" font-family="Georgia, 'Times New Roman', serif" font-size="22">PM phone</text>
    <text x="300" y="664" text-anchor="middle" fill="#5e8aa6" font-family="Georgia, 'Times New Roman', serif" font-size="22">quiet</text>
  </g>
  <!-- right: question log -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7fb6d6">
    <text x="1060" y="560">Question log</text>
    <rect x="1060" y="580" width="220" height="14" rx="7" fill="#0a3a66"/>
    <rect x="1060" y="580" width="170" height="14" rx="7" fill="#00B5E2"/>
    <rect x="1060" y="614" width="220" height="14" rx="7" fill="#0a3a66"/>
    <rect x="1060" y="614" width="110" height="14" rx="7" fill="#7fb6d6"/>
    <rect x="1060" y="648" width="220" height="14" rx="7" fill="#0a3a66"/>
    <rect x="1060" y="648" width="70" height="14" rx="7" fill="#5e8aa6"/>
    <text x="1060" y="700" fill="#cfe5f1">by trade and area</text>
  </g>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accent)"/>
</svg>
