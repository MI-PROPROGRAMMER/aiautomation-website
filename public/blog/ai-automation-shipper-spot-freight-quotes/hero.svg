<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a36"/>
      <stop offset="1" stop-color="#002347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B5E2" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00B5E2" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#7fb6d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#00B5E2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#glow)"/>

  <text x="140" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="6" fill="#00B5E2">THE JOURNAL</text>
  <text x="140" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#ffffff">Spot Quotes for Shippers,</text>
  <text x="140" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="bold" fill="#ffffff">Run by AI Automation</text>
  <text x="140" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#cfe5f1" opacity="0.9">From rejected tender to approved award, in one view</text>

  <!-- Scattered broker quotes on the left -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#cfe5f1">
    <rect x="150" y="540" width="250" height="62" rx="8" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2" transform="rotate(-4 275 571)"/>
    <text x="175" y="580" transform="rotate(-4 275 571)">Broker A  $2,480</text>
    <rect x="200" y="630" width="250" height="62" rx="8" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2" transform="rotate(3 325 661)"/>
    <text x="225" y="670" transform="rotate(3 325 661)">Broker B  call me</text>
    <rect x="140" y="720" width="250" height="62" rx="8" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2" transform="rotate(-2 265 751)"/>
    <text x="165" y="760" transform="rotate(-2 265 751)">Broker C  $2,315*</text>
    <rect x="230" y="800" width="250" height="62" rx="8" fill="#0a3a66" stroke="#5e8aa6" stroke-width="2" opacity="0.7" transform="rotate(5 355 831)"/>
    <text x="255" y="840" opacity="0.7" transform="rotate(5 355 831)">Broker D  ...</text>
  </g>

  <!-- Arrow -->
  <path d="M540 700 L700 700" stroke="#00B5E2" stroke-width="5" fill="none"/>
  <path d="M700 682 L730 700 L700 718 Z" fill="#00B5E2"/>

  <!-- Ranked shortlist on the right -->
  <rect x="780" y="530" width="580" height="340" rx="14" fill="#002347" stroke="#00B5E2" stroke-width="2"/>
  <text x="815" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3" fill="#7fb6d6">RANKED SHORTLIST</text>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="28">
    <rect x="810" y="605" width="520" height="62" rx="8" fill="#00B5E2" fill-opacity="0.18" stroke="#00B5E2" stroke-width="2"/>
    <text x="835" y="646" fill="#ffffff">1  Broker C   all-in</text>
    <text x="1300" y="646" fill="#00B5E2" text-anchor="end">Approve</text>
    <rect x="810" y="682" width="520" height="62" rx="8" fill="#0a3a66"/>
    <text x="835" y="723" fill="#cfe5f1">2  Broker A   all-in</text>
    <rect x="810" y="759" width="520" height="62" rx="8" fill="#0a3a66"/>
    <text x="835" y="800" fill="#cfe5f1">3  Broker E   all-in</text>
  </g>
  <text x="815" y="852" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#5e8aa6">vs lane history and market rate</text>

  <rect x="0" y="994" width="1500" height="6" fill="url(#accentLine)"/>
</svg>
