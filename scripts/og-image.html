<!doctype html>
<!-- Source for public/og-image.png (1200x630 link preview).
     Re-render: see scripts/render-og.sh -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #002347; }
  .card {
    position: relative; width: 1200px; height: 630px; color: #fff;
    background:
      radial-gradient(900px 500px at 88% 70%, rgba(0,181,226,0.16), transparent 60%),
      radial-gradient(700px 500px at 0% 0%, rgba(0,20,45,0.9), transparent 70%),
      #002347;
    font-family: Inter, sans-serif;
  }
  svg.lines { position: absolute; inset: 0; }
  .brand { position: absolute; left: 72px; top: 60px; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
  .brand em { font-family: 'Playfair Display', serif; font-style: italic; color: #00B5E2; font-weight: 500; }
  .kicker { position: absolute; left: 72px; top: 318px; font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.22em; color: #00B5E2; text-transform: uppercase; }
  h1 { position: absolute; left: 68px; top: 352px; font-family: 'Playfair Display', serif; font-weight: 500; font-size: 84px; line-height: 1.02; letter-spacing: -0.02em; }
  h1 em { color: #00B5E2; }
  .sub { position: absolute; left: 72px; bottom: 58px; font-size: 22px; color: rgba(255,255,255,0.72); }
  .url { position: absolute; right: 72px; bottom: 58px; font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 0.08em; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div class="card">
  <svg class="lines" width="1200" height="630" viewBox="0 0 1200 630" id="svg">
    <defs>
      <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#9fdcf0" stop-opacity="0.05"/>
        <stop offset="0.35" stop-color="#9fdcf0" stop-opacity="0.38"/>
        <stop offset="0.75" stop-color="#00B5E2" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#00B5E2" stop-opacity="0.9"/>
      </linearGradient>
      <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="tangle" fill="none" stroke="url(#fade)" stroke-linecap="round"></g>
    <path d="M 905 250 L 1200 250" stroke="#00B5E2" stroke-width="3" filter="url(#glow)"/>
    <circle cx="905" cy="250" r="7" fill="#00B5E2" filter="url(#glow)"/>
  </svg>
  <div class="brand">Apexify<em>Labs</em></div>
  <div class="kicker">AI automation &amp; agents</div>
  <h1>Your operations,<br><em>untangled.</em></h1>
  <div class="sub">Custom AI that takes the manual work off your team.</div>
  <div class="url">apexifylabs.com</div>
</div>
<script>
  // Seeded RNG so the render is repeatable.
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const g = document.getElementById('tangle');
  const NS = 'http://www.w3.org/2000/svg';
  const knot = { x: 905, y: 250 };
  for (let i = 0; i < 46; i++) {
    // Start somewhere loose on the upper-left/centre, loop around, then converge on the knot.
    const x0 = 280 + rnd() * 380, y0 = 40 + rnd() * 220;
    const p = [`M ${x0.toFixed(1)} ${y0.toFixed(1)}`];
    let x = x0, y = y0;
    const loops = 2 + Math.floor(rnd() * 3);
    for (let k = 0; k < loops; k++) {
      const nx = 300 + rnd() * 520, ny = 40 + rnd() * 220;
      const c1x = x + (rnd() - 0.5) * 420, c1y = y + (rnd() - 0.5) * 220;
      const c2x = nx + (rnd() - 0.5) * 420, c2y = ny + (rnd() - 0.5) * 220;
      p.push(`C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)}`);
      x = nx; y = ny;
    }
    p.push(`C ${(x + 120).toFixed(1)} ${(y + (rnd() - 0.5) * 120).toFixed(1)} ${knot.x - 90} ${knot.y + (rnd() - 0.5) * 30} ${knot.x} ${knot.y}`);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', p.join(' '));
    path.setAttribute('stroke-width', (0.6 + rnd() * 0.9).toFixed(2));
    g.appendChild(path);
  }
</script>
</body>
</html>
